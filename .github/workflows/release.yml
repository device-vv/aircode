name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: aircode-windows-x86_64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: aircode-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: aircode-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ runner.os == 'Linux' && 'v033-rust-ubuntu22' || 'v0-rust' }}
          shared-key: check
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev libx11-dev libxcb1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "dist/${{ matrix.archive }}"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aircode.exe" "$package/aircode.exe"
          Copy-Item "README.md" "$package/README.md"
          Copy-Item "LICENSE" "$package/LICENSE"
          Compress-Archive -Path "$package/*" -DestinationPath "dist/${{ matrix.archive }}.zip" -Force
          $hash = (Get-FileHash "dist/${{ matrix.archive }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.archive }}.zip" | Out-File "dist/${{ matrix.archive }}.zip.sha256" -Encoding ascii
      - name: Package Linux portable archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package="dist/${{ matrix.archive }}"
          mkdir -p "$package"
          cp "target/${{ matrix.target }}/release/aircode" "$package/aircode"
          cp README.md LICENSE "$package/"
          chmod +x "$package/aircode"
          tar -C dist -czf "dist/${{ matrix.archive }}.tar.gz" "${{ matrix.archive }}"
          cd dist
          sha256sum "${{ matrix.archive }}.tar.gz" > "${{ matrix.archive }}.tar.gz.sha256"
      - name: Package macOS portable archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          package="dist/${{ matrix.archive }}"
          mkdir -p "$package"
          cp "target/${{ matrix.target }}/release/aircode" "$package/aircode"
          cp README.md LICENSE "$package/"
          chmod +x "$package/aircode"
          tar -C dist -czf "dist/${{ matrix.archive }}.tar.gz" "${{ matrix.archive }}"
          cd dist
          shasum -a 256 "${{ matrix.archive }}.tar.gz" > "${{ matrix.archive }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aircode-*
          path: dist
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist
          test -f "dist/aircode-windows-x86_64.zip"
          test -f "dist/aircode-linux-x86_64.tar.gz"
          test -f "dist/aircode-macos-arm64.tar.gz"
          test -f "dist/aircode-windows-x86_64.zip.sha256"
          test -f "dist/aircode-linux-x86_64.tar.gz.sha256"
          test -f "dist/aircode-macos-arm64.tar.gz.sha256"
          (cd dist && sha256sum -c -- *.sha256)
      - uses: softprops/action-gh-release@v2
        id: upload
        with:
          name: AIRcode ${{ github.ref_name }}
          draft: true
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: dist/*
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ steps.upload.outputs.id }}
        run: |
          curl --fail-with-body --retry 3 --request PATCH \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/json" \
            "$API_URL/repos/$REPOSITORY/releases/$RELEASE_ID" \
            --data '{"draft":false,"make_latest":"true"}' --output /dev/null
