name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package portable application
        shell: pwsh
        run: |
          $package = "dist/aircode-windows-x86_64"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/aircode.exe" "$package/aircode.exe"
          Copy-Item "README.md" "$package/README.md"
          Copy-Item "LICENSE" "$package/LICENSE"
          Compress-Archive -Path "$package/*" -DestinationPath "dist/aircode-windows-x86_64.zip" -Force
          $hash = (Get-FileHash "dist/aircode-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  aircode-windows-x86_64.zip" | Out-File "dist/aircode-windows-x86_64.zip.sha256" -Encoding ascii
      - uses: softprops/action-gh-release@v2
        with:
          name: AIRcode ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            dist/aircode-windows-x86_64.zip
            dist/aircode-windows-x86_64.zip.sha256
