[workspace]
members = ["crates/aircode-app", "crates/aircode-core", "crates/aircode-ui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
aircode-core = { path = "crates/aircode-core" }
aircode-ui = { path = "crates/aircode-ui" }
gpui = "0.2.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
