[workspace]
members = [
    "crates/aircode-ai",
    "crates/aircode-app",
    "crates/aircode-core",
    "crates/aircode-editor",
    "crates/aircode-ui",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
aircode-ai = { path = "crates/aircode-ai" }
aircode-core = { path = "crates/aircode-core" }
aircode-editor = { path = "crates/aircode-editor" }
aircode-ui = { path = "crates/aircode-ui" }
futures-util = "0.3.31"
gpui = "0.2.2"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7.18"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
